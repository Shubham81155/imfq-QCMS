<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Performance & Network Acceleration: Critical Preloads -->
    <link rel="preload" href="/assets/dist/core.1a087e1b.min.css" as="style">
    <link rel="preload" href="/assets/dist/auth-guard.bb0c9864.min.js" as="script">
    <script src="/assets/dist/auth-guard.bb0c9864.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with OTP | OctaQube Enterprise</title>
    <link rel="stylesheet" href="/assets/dist/core.1a087e1b.min.css">
    <script src="/assets/dist/lucide.min.js"></script>
    <style>
        #ai-chat-widget,
        #helpdesk-widget,
        .chat-toggle-btn,
        .helpdesk-toggle-btn,
        #app-sidebar,
        #app-navbar,
        #octaqube-mobile-bottom-nav {
            display: none !important;
        }

        body {
            background: var(--ds-bg-mesh);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .login-wrapper {
            display: flex;
            max-width: 1000px;
            width: 100%;
            min-height: 600px;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: var(--ds-shadow-xl);
            background: var(--ds-bg-surface);
            border: 1px solid var(--ds-glass-border);
        }

        .login-branding {
            flex: 1.1;
            padding: var(--ds-space-12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border-right: 1px solid var(--ds-border-color);
            position: relative;
            overflow: hidden;
        }

        .login-branding::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, var(--ds-accent-ghost) 0%, transparent 70%);
            opacity: 0.4;
            pointer-events: none;
        }

        .login-branding h1 {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.06em;
            color: var(--ds-text-main);
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .login-form-section {
            flex: 1;
            padding: var(--ds-space-12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--ds-bg-surface);
        }

        .login-form-section h2 {
            font-size: 2rem;
            font-weight: 850;
            letter-spacing: -0.04em;
            margin-bottom: var(--ds-space-2);
            color: var(--ds-text-main);
        }

        .login-form-section .subtitle {
            color: var(--ds-text-secondary);
            font-size: 0.9375rem;
            margin-bottom: var(--ds-space-10);
            line-height: 1.5;
        }

        .ds-field {
            margin-bottom: var(--ds-space-6);
        }

        .ds-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8125rem;
            font-weight: 650;
            margin-bottom: var(--ds-space-3);
            color: var(--ds-text-secondary);
        }

        .ds-label i {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--ds-space-8);
            font-size: 0.8125rem;
        }

        .forgot-password {
            color: var(--ds-accent);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .char-counter,
        #otpCodeFieldContainer .char-counter,
        .no-counter + .char-counter,
        .no-counter ~ .char-counter {
            display: none !important;
        }

        .login-footer {
            text-align: center;
            margin-top: var(--ds-space-10);
            font-size: 0.875rem;
            color: var(--ds-text-secondary);
            border-top: 1px solid var(--ds-border-color);
            padding-top: var(--ds-space-6);
        }

        .login-footer a {
            color: var(--ds-accent);
            font-weight: 700;
            text-decoration: none;
            margin-left: 0.35rem;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 500px;
                min-height: auto;
            }

            .login-branding {
                padding: var(--ds-space-10);
                border-right: none;
                border-bottom: 1px solid var(--ds-border-color);
            }

            .login-branding h1 {
                font-size: 2.5rem;
                text-align: center;
            }

            .login-form-section {
                padding: var(--ds-space-10);
            }
        }
    </style>
</head>

<body class="fade-in">
    <div class="login-wrapper glass-card">
        <!-- Left: Branding -->
        <div class="login-branding">
            <div style="margin-bottom: auto;">
                <div class="brand-text" id="loginBrandHeader"
                    style="font-size: 1.1rem; opacity: 0.8; font-weight: 700; display:flex; align-items:center; gap:8px;">
                    <span id="loginBrandLogoSlot" style="display:flex;align-items:center;"><i data-lucide="shield-check" style="width:20px; height:20px;"></i></span>
                    <span id="loginBrandShortName">OctaQube</span> <small id="loginBrandTagline" style="font-size: 0.75rem; opacity: 0.6; font-weight: 500;">ENTERPRISE</small>
                </div>
            </div>
            <h1 id="loginPlatformTitle">Quality Management System</h1>
            <div style="margin-top: auto;"></div>
        </div>

        <!-- Right: Form -->
        <div class="login-form-section">
            <h2>Sign in with OTP</h2>
            <p class="subtitle" id="loginFormSubtitle">Enter your Email ID or Phone Number to receive a secure login code</p>

            <div id="errorMsg" class="ds-toast error mb-4"
                style="display:none !important; width: 100%; min-width: auto; animation: none;">
                <i data-lucide="alert-circle"></i>
                <span></span>
            </div>
            <div id="successMsg" class="ds-toast success mb-4"
                style="display:none !important; width: 100%; min-width: auto; animation: none;">
                <i data-lucide="check-circle"></i>
                <span></span>
            </div>

            <form id="otpLoginForm" action="javascript:void(0);" onsubmit="return false;" autocomplete="on">
                <div class="ds-field" id="identifierFieldContainer">
                    <label class="ds-label" id="identifierLabel">
                        <i data-lucide="mail"></i> <span id="identifierLabelText">Email ID or Phone Number</span> <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="ds-input" id="username"
                        placeholder="Enter registered Email ID or 10-digit Phone" required autocomplete="username"
                        autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email">
                </div>

                <!-- OTP Code Field Container -->
                <div class="ds-field" id="otpCodeFieldContainer" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="ds-label mb-0"><i data-lucide="key-round"></i> 6-Digit Verification Code <span class="text-danger">*</span></label>
                        <a href="javascript:void(0)" class="text-xxs fw-semibold text-secondary hover-underline" onclick="resetOtpStep()" style="font-size: 0.75rem; text-decoration: none; color: var(--ds-accent);">Change Email / Phone</a>
                    </div>
                    <input type="text" class="ds-input text-center fw-bold no-counter" id="loginOtpInput" data-no-counter="true" placeholder="••••••" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" style="letter-spacing: 8px; font-size: 1.25rem; font-family: monospace; background: var(--ds-bg-surface);">
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <span class="text-xxs text-muted" id="otpDestinationHint" style="font-size: 0.75rem;">Code valid for 10 minutes.</span>
                        <div id="otpResendContainer">
                            <span id="otpCountdownText" class="text-xxs text-muted" style="font-size: 0.75rem;">Resend in <strong id="otpTimerSec">60</strong>s</span>
                            <button type="button" id="btnResendOtp" class="ds-btn ds-btn-ghost ds-btn-xs text-primary p-0" style="display:none; font-size:0.75rem; text-decoration:underline; font-weight: 600;" onclick="resendLoginOtp()">Resend OTP</button>
                        </div>
                    </div>
                </div>

                <div class="login-options" id="loginOptionsContainer">
                    <a href="login.html" class="forgot-password" id="linkSignInWithPassword">
                        <i data-lucide="arrow-left" style="width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 2px;"></i> Sign in with Password
                    </a>
                </div>

                <button type="submit" class="ds-btn ds-btn-primary w-100 ds-btn-lg" id="loginBtn">
                    <span style="display:flex;align-items:center;justify-content:center;gap:8px">
                        <i data-lucide="send" style="width:16px;height:16px;"></i> Send OTP
                    </span>
                </button>
            </form>

            <div class="login-footer">
                Create an Organization Account? <a href="register-org.html">Sign up</a>
            </div>
        </div>
    </div>

    <script src="/assets/dist/core-bundle.b4a62f66.min.js"></script>
    <script src="/assets/dist/enterprise-validator.min.js"></script>
    <script>
        let _otpStep = 1;
        let _savedOtpIdentifier = '';
        let _otpCountdownTimer = null;

        function _showAuthError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            if (!errorMsg) return;
            const span = errorMsg.querySelector('span');
            if (span) span.textContent = msg;
            else errorMsg.textContent = msg;
            errorMsg.style.setProperty('display', 'flex', 'important');
            const successMsg = document.getElementById('successMsg');
            if (successMsg) successMsg.style.setProperty('display', 'none', 'important');
        }

        function _showAuthSuccess(msg) {
            const successMsg = document.getElementById('successMsg');
            if (!successMsg) return;
            const span = successMsg.querySelector('span');
            if (span) span.textContent = msg;
            else successMsg.textContent = msg;
            successMsg.style.setProperty('display', 'flex', 'important');
            const errorMsg = document.getElementById('errorMsg');
            if (errorMsg) errorMsg.style.setProperty('display', 'none', 'important');
        }

        function _clearAuthMessages() {
            const errorMsg = document.getElementById('errorMsg');
            if (errorMsg) errorMsg.style.setProperty('display', 'none', 'important');
            const successMsg = document.getElementById('successMsg');
            if (successMsg) successMsg.style.setProperty('display', 'none', 'important');
        }

        function resetOtpStep() {
            _otpStep = 1;
            _clearAuthMessages();
            const otpContainer = document.getElementById('otpCodeFieldContainer');
            const usernameInput = document.getElementById('username');
            const loginBtn = document.getElementById('loginBtn');
            const otpInput = document.getElementById('loginOtpInput');

            if (otpContainer) otpContainer.style.display = 'none';
            if (otpInput) otpInput.value = '';
            if (usernameInput) {
                usernameInput.removeAttribute('readonly');
                usernameInput.removeAttribute('disabled');
                usernameInput.focus();
            }
            if (loginBtn) {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><i data-lucide="send" style="width:16px;height:16px;"></i> Send OTP</span>';
            }
            if (_otpCountdownTimer) {
                clearInterval(_otpCountdownTimer);
                _otpCountdownTimer = null;
            }
            if (window.lucide) lucide.createIcons();
        }

        function startOtpCountdown(seconds = 60) {
            if (_otpCountdownTimer) clearInterval(_otpCountdownTimer);
            let left = seconds;
            const timerSec = document.getElementById('otpTimerSec');
            const countdownTxt = document.getElementById('otpCountdownText');
            const resendBtn = document.getElementById('btnResendOtp');

            if (countdownTxt) countdownTxt.style.display = '';
            if (resendBtn) resendBtn.style.display = 'none';
            if (timerSec) timerSec.textContent = left;

            _otpCountdownTimer = setInterval(() => {
                left -= 1;
                if (timerSec) timerSec.textContent = left;
                if (left <= 0) {
                    clearInterval(_otpCountdownTimer);
                    _otpCountdownTimer = null;
                    if (countdownTxt) countdownTxt.style.display = 'none';
                    if (resendBtn) resendBtn.style.display = 'inline-block';
                }
            }, 1000);
        }

        async function resendLoginOtp() {
            const identifier = _savedOtpIdentifier || (document.getElementById('username')?.value || '').trim();
            if (!identifier) {
                _showAuthError('Please enter your Email ID or Phone Number.');
                return;
            }
            const resendBtn = document.getElementById('btnResendOtp');
            if (resendBtn) {
                resendBtn.disabled = true;
                resendBtn.textContent = 'Sending...';
            }
            try {
                const res = await api.post('/auth/login-otp/send', { identifier });
                _showAuthSuccess(res.msg || 'A new verification code has been dispatched.');
                startOtpCountdown(60);
            } catch (err) {
                _showAuthError(err.message || 'Failed to resend code. Please try again.');
                if (resendBtn) resendBtn.disabled = false;
            }
        }

        function handleLoginSuccess(data, loginBtn) {
            if (data.access_token) {
                if (window.api) window.api.token = data.access_token;
                sessionStorage.setItem('token', data.access_token);
                sessionStorage.setItem('access_token', data.access_token);
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('access_token', data.access_token);
            }
            sessionStorage.setItem('octaqube_authenticated', 'true');
            localStorage.setItem('octaqube_authenticated', 'true');

            const userPayload = JSON.stringify({
                username: data.username,
                full_name: data.full_name || data.username,
                profile_picture: data.profile_picture || null,
                banner_image: data.banner_image || null,
                email: data.email,
                role: data.role,
                role_name: data.role_name || data.role,
                role_permissions: data.role_permissions || null,
                org_id: data.org_id,
                org_name: data.org_name,
                dept_id: data.department_id || data.dept_id,
                department_id: data.department_id || data.dept_id,
                department: data.department || data.department_name,
                department_name: data.department_name || data.department,
                plant_id: data.plant_id,
                plant_name: data.plant_name || data.location,
                location: data.location || data.plant_name,
                custom_fields: data.custom_fields || {},
                sa_sub_role: data.sa_sub_role || (data.custom_fields && data.custom_fields.super_admin_role) || (data.role === 'SuperAdmin' ? 'Owner' : null),
                subscription_plan: data.subscription_plan,
                subscription_status: data.subscription_status,
                id: data.id,
                language: data.language,
                org_timezone: data.org_timezone,
                org_primary_color: data.org_primary_color || null,
                org_logo_url: data.org_logo_url || null,
                org_favicon_url: data.org_favicon_url || null
            });

            sessionStorage.setItem('user', userPayload);
            localStorage.setItem('user', userPayload);

            if (data.role_permissions) {
                sessionStorage.setItem('role_permissions', JSON.stringify(data.role_permissions));
                localStorage.setItem('role_permissions', JSON.stringify(data.role_permissions));
            }

            const now = Date.now().toString();
            sessionStorage.setItem('octaqube_last_activity', now);
            localStorage.setItem('octaqube_last_activity', now);

            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>Redirecting to dashboard...</span>';
            }

            const rawRole = data.role || data.role_name;
            const normRole = (function(r) {
                if (!r) return 'Team Member';
                let roleStr = r;
                if (typeof r === 'object') {
                    roleStr = r.name || r.role_name || r.role || '';
                }
                if (!roleStr || typeof roleStr !== 'string') return 'Team Member';
                const clean = roleStr.trim().toLowerCase();
                if (clean === 'superadmin' || clean === 'super admin' || clean === 'super_admin') return 'SuperAdmin';
                if (clean === 'admin') return 'Admin';
                if (clean === 'reviewer') return 'Reviewer';
                if (clean === 'facilitator') return 'Facilitator';
                if (clean === 'team leader' || clean === 'teamleader' || clean === 'team_leader') return 'Team Leader';
                if (clean === 'team member' || clean === 'teammember' || clean === 'team_member') return 'Team Member';
                if (clean === 'ceo') return 'CEO';
                return roleStr;
            })(rawRole);

            const dashboardMap = {
                'SuperAdmin': '/admin/super-admin.html',
                'Admin': '/dashboard/dashboard-admin.html',
                'Reviewer': '/dashboard/dashboard-reviewer.html',
                'Facilitator': '/dashboard/dashboard-facilitator.html',
                'Team Leader': '/dashboard/dashboard-team-member.html',
                'Team Member': '/dashboard/dashboard-team-member.html',
                'CEO': '/dashboard/dashboard-ceo.html'
            };

            const targetDashboard = dashboardMap[normRole] || '/dashboard/dashboard-team-member.html';
            window.location.replace(targetDashboard);
        }

        // Auto-advance OTP input
        document.getElementById('loginOtpInput')?.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            if (e.target.value.length === 6) {
                document.getElementById('otpLoginForm')?.dispatchEvent(new Event('submit', { cancelable: true }));
            }
        });

        // Form Submit Handler
        document.getElementById('otpLoginForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');

            if (_otpStep === 1) {
                const identifier = (document.getElementById('username')?.value || '').trim();
                if (!identifier) {
                    _showAuthError('Please enter your registered Email ID or Phone Number.');
                    return;
                }

                if (loginBtn) {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>Verifying & sending OTP...</span>';
                }
                _clearAuthMessages();

                try {
                    const res = await api.post('/auth/login-otp/send', { identifier }, { button: null });
                    _savedOtpIdentifier = identifier;
                    _otpStep = 2;
                    _showAuthSuccess(res.msg || 'Verification code sent successfully.');

                    const usernameInput = document.getElementById('username');
                    if (usernameInput) {
                        usernameInput.setAttribute('readonly', 'true');
                    }

                    const otpContainer = document.getElementById('otpCodeFieldContainer');
                    if (otpContainer) otpContainer.style.display = 'block';

                    const hintEl = document.getElementById('otpDestinationHint');
                    if (hintEl && res.masked_destination) {
                        hintEl.textContent = `Code sent to ${res.masked_destination}. Valid for 10 minutes.`;
                    }

                    startOtpCountdown(60);

                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><i data-lucide="check-circle" style="width:16px;height:16px;"></i> Verify & Sign In</span>';
                    }

                    const otpInput = document.getElementById('loginOtpInput');
                    if (otpInput) {
                        otpInput.value = '';
                        otpInput.focus();
                    }
                    if (window.lucide) lucide.createIcons();
                } catch (err) {
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><i data-lucide="send" style="width:16px;height:16px;"></i> Send OTP</span>';
                    }
                    _showAuthError(err.message || 'No registered account found with this email or phone number.');
                    if (window.lucide) lucide.createIcons();
                }
            } else {
                const identifier = _savedOtpIdentifier || (document.getElementById('username')?.value || '').trim();
                const otp = (document.getElementById('loginOtpInput')?.value || '').trim();

                if (!otp || otp.length < 6) {
                    _showAuthError('Please enter the full 6-digit verification code.');
                    return;
                }

                if (loginBtn) {
                    loginBtn.disabled = true;
                    loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>Verifying code...</span>';
                }
                _clearAuthMessages();

                try {
                    const data = await api.post('/auth/login-otp/verify', { identifier, otp, remember_me: false }, { button: null });
                    handleLoginSuccess(data, loginBtn);
                } catch (err) {
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '<span style="display:flex;align-items:center;justify-content:center;gap:8px"><i data-lucide="check-circle" style="width:16px;height:16px;"></i> Verify & Sign In</span>';
                    }
                    _showAuthError(err.message || 'Invalid or expired verification code.');
                    if (window.lucide) lucide.createIcons();
                }
            }
        });

        // Dynamic branding load
        window.addEventListener('DOMContentLoaded', async () => {
            // Clean up any stray authenticated shell elements on public auth page
            ['octaqube-mobile-bottom-nav', 'sidebar-backdrop', 'ai-chat-widget', 'helpdesk-widget', 'app-sidebar', 'app-navbar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.remove();
            });

            if (window.lucide) lucide.createIcons();
            try {
                const url = api.baseUrl + '/auth/login-config';
                const res = await fetch(url);
                if (!res.ok) return;
                const data = await res.json();
                const b = data.branding || {};
                const shortName = b.software_short_name || 'OctaQube';
                const softName  = b.software_name || 'OctaQube Enterprise';
                const platTitle = b.platform_title || 'Quality Management System';
                const tagline   = b.platform_subtitle || b.tagline || 'ENTERPRISE';

                const brandShortEl = document.getElementById('loginBrandShortName');
                if (brandShortEl) brandShortEl.textContent = shortName;

                const accountShortEl = document.getElementById('loginAccountShortName');
                if (accountShortEl) accountShortEl.textContent = shortName;

                const brandTaglineEl = document.getElementById('loginBrandTagline');
                if (brandTaglineEl) brandTaglineEl.textContent = tagline.toUpperCase();

                const platTitleEl = document.getElementById('loginPlatformTitle');
                if (platTitleEl) platTitleEl.textContent = platTitle;

                document.title = 'Sign in with OTP | ' + softName;

                const logoSlot = document.getElementById('loginBrandLogoSlot');
                if (logoSlot) {
                    const logoSrc = b.platform_logo_url || b.logo_url;
                    if (logoSrc && !logoSrc.includes('/assets/img/logo.png')) {
                        logoSlot.innerHTML = '<img src="' + logoSrc + '" alt="' + shortName + ' Logo" style="height:22px; max-width:120px; object-fit:contain;" onerror="this.outerHTML=\'<i data-lucide=\\\'shield-check\\\' style=\\\width:20px;height:20px;\\\'></i>\'; if(window.lucide) lucide.createIcons();">';
                    }
                }

                if (b.primary_color) {
                    document.documentElement.style.setProperty('--ds-accent', b.primary_color);
                    document.documentElement.style.setProperty('--ds-primary', b.primary_color);
                }

                if (window.lucide) lucide.createIcons();
            } catch (_) {}
        });
    </script>
